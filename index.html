<!DOCTYPE html>
<hmtl lang ="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <title>Payment form example</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body>
        <div class="container mt-5">
            <div class="card">
                <div class="card-header">
                    <h5>Payment form example</h5>
                </div>
                <div class="alert alert-danger m-3">
                    Some fields are missing
                </div>
                <form class="p-3">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label>Card #</label>
                            <input type="text" class="form-control" placeholder="XXXXX" required>
                        </div>
                        <div class="col-md-3">
                            <label>CVC #</label>
                            <input type="number" class="form-control" placeholder="00000" required>
                        </div>
                        <div class="col-md-3">
                            <label>Amount</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" placeholder="Amount" required>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label>First Name</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label>Last Name</label>
                            <input type="text" class="form-control" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label>City</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label>State</label>
                            <select class="form-select">
                                <option selected>Pick a State</option>
                                <option>Aguascalientes</option>
                                <option>Baja California</option>
                                <option>Baja California Sur</option>
                                <option>Campeche</option>
                                <option>Chiapas</option>
                                <option>Chihuahua</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label>Postal Code</label>
                            <input type="text" class="form-control">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">We accept:</label><br>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="card">
                            <label class="form-check-label">
                                <i class="fa-brands fa-cc-mastercard text-danger"></i>
                            </label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="card">
                            <label class="form-check-label">
                                <i class="fa-brands fa-cc-visa text-primary"></i>
                            </label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="card">
                            <label class="form-check-label">
                                <i class="fa-brands fa-cc-diners-club text-info"></i>
                            </label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="card">
                            <label class="form-check-label">
                                <i class="fa-brands fa-cc-amex text-secondary"></i>
                            </label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label>Message</label>
                        <textarea class="form-control" rows="3"></textarea>
                        <small class="text-muted">Add any notes</small>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="button" class="btn btn-secondary me-2">Cancel</button>
                        <button type="submit" class="btn btn-primary">Send</button>
                    </div>
                </form>
            </div>
        </div>
    </body>
</hmtl>
